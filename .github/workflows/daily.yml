name: Daily fetch & deploy

on:
  schedule:
    # 1日3回: JST 06:00 / 13:00 / 22:00
    # 06:00 JST (21:00 UTC前日): 米国夜間試合 Final 反映
    # 13:00 JST (04:00 UTC):     現状の主要更新（全試合終了後）
    # 22:00 JST (13:00 UTC):     米国朝、当日デーゲームの先発確定を反映
    - cron: "0 21 * * *"
    - cron: "0 4 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # 手動実行も可
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - "static/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch data from MLB Stats API
        run: python scripts/fetch.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
